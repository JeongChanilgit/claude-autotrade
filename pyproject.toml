[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos"
version = "0.1.0"
description = "OOS backtest-only validation system for 4-strategy crypto perp ensemble"
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "peter" }]

dependencies = [
  # Web (Phase 0+) — always required for dashboard API skeleton
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "websockets>=12",
  "pydantic>=2.6",
  # Data core (Phase 1+)
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "duckdb>=1.0",
  "httpx>=0.27",
  "tenacity>=8.2",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
engines = [
  # Phase 2+. vectorbt 1.0.0 supports Python 3.13 via numba 0.65 / llvmlite 0.47.
  "vectorbt>=1.0.0",
  "backtrader>=1.9.78",
  "scipy>=1.12",
  "polars>=1.0",
]
reports = [
  # Phase 5
  "matplotlib>=3.8",
  "reportlab>=4.1",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "mypy>=1.9",
  "ruff>=0.4",
  "pandas-stubs",
  "types-requests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kairos*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: tests that hit the network or filesystem",
  "slow: tests >1s",
  "golden: hand-calculated reference cases",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["kairos"]
branch = true
omit = ["kairos/dashboard/web/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/fixtures/", "kairos/dashboard/web/"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
